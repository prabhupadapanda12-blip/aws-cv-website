
name: Deploy CV Website to AWS S3

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          OIDC_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "Could not retrieve GitHub OIDC token"
            exit 1
          fi

          export OIDC_TOKEN

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC issuer:", claims.get("iss"))
          print("OIDC audience:", claims.get("aud"))
          print("OIDC subject:", claims.get("sub"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::450690783421:role/GitHubCVDeployRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://prabhupada-github-cv-site-2026 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"

      - name: Deployment success
        run: echo "Website deployed successfully!"
